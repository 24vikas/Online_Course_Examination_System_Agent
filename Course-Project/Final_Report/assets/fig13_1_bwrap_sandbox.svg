  <text x="843.0" y="531" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">CRLF -&gt; LF Conversion</text>
  <text x="843.0" y="548" text-anchor="middle" font-size="10.0" font-weight="400" fill="#475569">Trailing Whitespace Strip</text>
  <rect x="376" y="488" width="264" height="76" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.25"/>
