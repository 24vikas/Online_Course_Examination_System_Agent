  <text x="46" y="258" font-size="11.5" font-weight="700" fill="#1E293B">STAGE 2: BUBBLEWRAP ISOLATED NAMESPACE BOUNDARY (bwrap --unshare-all)</text>
  <rect x="46" y="274" width="796" height="106" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1" stroke-dasharray="4,3"/>
  <text x="62" y="292" font-size="10.2" font-weight="700" fill="#334155">SANDBOX SECURITY CONSTRAINTS (Applied Simultaneously)</text>
  <rect x="62" y="300" width="240" height="68" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.25"/>
  <text x="182.0" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Namespace Unsharing</text>
  <text x="182.0" y="343" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">--unshare-all (PID/NET/IPC/MNT)</text>
  <text x="182.0" y="360" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">Zero Network / Socket Access</text>
  <rect x="322" y="300" width="248" height="68" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.25"/>
  <text x="446.0" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Read-Only Runtime Binds</text>
  <text x="446.0" y="343" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">--ro-bind /usr /usr, /lib /lib</text>
  <text x="446.0" y="360" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">Immutable Interpreter &amp; Libs</text>
  <rect x="590" y="300" width="236" height="68" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.25"/>
  <text x="708.0" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Ephemeral Tmpfs Scratch</text>
  <text x="708.0" y="343" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">--tmpfs /tmp (Isolated RAM)</text>
  <text x="708.0" y="360" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">256 MB Memory Ceiling</text>
  <rect x="924" y="274" width="390" height="106" rx="5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.25"/>
  <text x="1119.0" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Execute Untrusted User Code</text>
