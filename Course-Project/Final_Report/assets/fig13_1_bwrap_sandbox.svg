<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 594" width="1360" height="594" style="background:#FFFFFF; font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;">
