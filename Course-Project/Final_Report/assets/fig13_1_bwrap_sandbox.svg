  <text x="176.0" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">POST /api/coding/run | /submit</text>
  <text x="176.0" y="131" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">Candidate Source Payload</text>
  <text x="176.0" y="148" text-anchor="middle" font-size="10.0" font-weight="400" fill="#475569">Authenticated Exam Session</text>
  <rect x="380" y="88" width="260" height="78" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.25"/>
  <text x="510.0" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Proctor Heartbeat Guard</text>
  <text x="510.0" y="131" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">Verifies Active Lease (&lt; 15s)</text>
  <text x="510.0" y="148" text-anchor="middle" font-size="10.0" font-weight="400" fill="#475569">Rejects Disconnected Attempts</text>
  <rect x="714" y="88" width="266" height="78" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.25"/>
  <text x="847.0" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Fetch Secret Hidden Tests</text>
  <text x="847.0" y="131" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">Server-Side Test Case Store</text>
  <text x="847.0" y="148" text-anchor="middle" font-size="10.0" font-weight="400" fill="#475569">Hidden Assertions Never Exposed</text>
  <rect x="1054" y="88" width="260" height="78" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.25"/>
  <text x="1184.0" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Launch Bubblewrap (bwrap)</text>
  <text x="1184.0" y="131" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">Spawns Subprocess Wrapper</text>
  <text x="1184.0" y="148" text-anchor="middle" font-size="10.0" font-weight="400" fill="#475569">4–6 ms Startup Overhead</text>
