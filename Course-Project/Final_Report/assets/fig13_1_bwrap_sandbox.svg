  <rect x="0" y="0" width="1360" height="594" fill="#FFFFFF"/>
  <text x="28" y="32" font-size="16" font-weight="700" fill="#0F172A">AURA — Bubblewrap (bwrap) Isolated Coding Execution Engine (bwrapJudge.ts)</text>
