services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aura-postgres
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AURA_DEV_POSTGRES_PASSWORD:?Set AURA_DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - aura-postgres-data:/var/lib/postgresql/data
    networks:
      - aura-internal-net
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  docling-serve:
    image: quay.io/ds4sd/docling-serve-cpu:v0.5.1
    container_name: aura-docling-serve
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - aura-internal-net
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-worker:
    build:
      context: ./workers/docker/embedding-worker
      dockerfile: Dockerfile
    image: aura/embedding-worker:bge-m3-v1
    container_name: aura-embedding-worker
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      MODEL_PATH: BAAI/bge-m3
      DEVICE: cpu
    volumes:
      - aura-model-cache:/home/aura/.cache
    networks:
      - aura-internal-net
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aura-internal-net:
    name: aura-internal-net

volumes:
  aura-postgres-data:
    name: aura-postgres-data
  aura-model-cache:
    name: aura-model-cache
